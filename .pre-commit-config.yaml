minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# Patterns these files must contain to do their job.
exclude: '^(tools/publication_guard\.py|tests/test_publication_guard\.py)$'

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
        exclude: '^(\.github/dependabot\.yml|LICENSE|LICENSE-DATA)$'
      - id: trailing-whitespace
        exclude: '^(LICENSE|LICENSE-DATA)$'
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-added-large-files
        args: ["--maxkb=256"]
      - id: detect-private-key
        exclude: '^\.pre-commit-config\.yaml$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        # Configuration (defect + security rules only) lives in ruff.toml.

  - repo: local
    hooks:
      - id: block-env-files
        name: block real environment files
        entry: Do not commit real environment files.
        language: fail
        files: '(^|/)\.env($|\.)'

      - id: block-private-key-files
        name: block private key files
        entry: Do not commit private keys, certificates, or credential files.
        language: fail
        files: '(^|/)[^/]*(id_rsa|id_ed25519|id_ecdsa|id_dsa|\.pem|\.key|\.p12|credentials?|secrets?)[^/]*$'

      - id: block-raw-captures
        name: block logs and raw captures
        entry: Do not commit logs, debug dumps or raw captures; commit sanitized fixtures only.
        language: fail
        files: '(^|/).*\.(log|dump|trace|pcap|pcapng|bin)$'

      - id: block-local-paths
        name: block local machine paths
        language: pygrep
        types: [text]
        entry: '(/Users/|/home/[^/]+/|/mnt/[A-Za-z]/Users/|[A-Za-z]:\\Users\\|[A-Za-z]:/Users/|\\\\[^\\/]+\\[^\\/]+)'
        exclude: '^(\.pre-commit-config\.yaml|\.githooks/pre-push)$'

      - id: block-ssh-hosts
        name: block ssh config and known hosts content
        language: pygrep
        types: [text]
        entry: '(\bHostName\s+\S+|\bIdentityFile\s+|BEGIN OPENSSH PRIVATE KEY|github_pat_|gh[pousr]_[A-Za-z0-9_]+)'
        exclude: '^\.pre-commit-config\.yaml$'

      - id: block-cloud-uris
        name: block private storage URIs
        language: pygrep
        types: [text]
        entry: '(s3://[A-Za-z0-9._-]+|gs://[A-Za-z0-9._-]+|gcs://[A-Za-z0-9._-]+|azure://[A-Za-z0-9._/-]+|wasbs?://[A-Za-z0-9._/-]+|abfss?://[A-Za-z0-9._/-]+|oss://[A-Za-z0-9._/-]+)'
        exclude: '^\.pre-commit-config\.yaml$'

      - id: block-local-network-targets
        name: block private IPs and localhost endpoints
        language: pygrep
        types: [text]
        entry: '(\b(localhost|host\.docker\.internal|0\.0\.0\.0|127\.0\.0\.1|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3})\b|(?<![:\w])::1(?![:\w]))'
        exclude: '^\.pre-commit-config\.yaml$'

      - id: block-binary-artifacts
        name: block local binary artifacts
        entry: Do not commit local archives, databases, or binary dumps.
        language: fail
        files: '(^|/).*\.(sqlite|db|tar|gz|zip|7z|rar|exe|dll|so|dylib)$'

      - id: corpus-guard
        name: corpus publication guard
        entry: python tools/publication_guard.py
        language: python
        pass_filenames: false
        always_run: true

      - id: corpus-validate
        name: corpus record validation
        entry: python tools/validate.py
        language: python
        additional_dependencies: ["jsonschema==4.25.1"]
        pass_filenames: false
        always_run: true

      - id: corpus-history-guard
        name: corpus history disclosure scan
        entry: python tools/history_guard.py --identities warn
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: corpus-tests
        name: corpus tests
        entry: python -m unittest discover -s tests
        language: python
        additional_dependencies: ["jsonschema==4.25.1"]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
